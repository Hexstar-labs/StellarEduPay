name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-drift:
    name: Check dependency version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Detect major-version mismatches
        run: node scripts/check-version-drift.js

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: \( {{ runner.os }}-node- \){{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - run: cd frontend && npm ci && cd ..
      - name: Audit root
        run: node scripts/check-dependency-audit.js .
      - name: Audit backend
        run: node scripts/check-dependency-audit.js backend
      - name: Audit frontend
        run: node scripts/check-dependency-audit.js frontend

  secret-scan:
    name: Scan example files for real-format secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Scan example files for secret material
        run: node scripts/scan-example-secrets.js

  migrations:
    name: Validate migration numbering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/validate-migrations.js

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: \( {{ runner.os }}-backend-node- \){{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Run ESLint (backend)
        run: cd backend && npx eslint src/ --max-warnings=0

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: \( {{ runner.os }}-frontend-node- \){{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Run next lint (frontend)
        run: cd frontend && npm run lint

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: \( {{ runner.os }}-frontend-node- \){{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Build frontend (next build)
        run: cd frontend && npm run build

  test:
    runs-on: ubuntu-latest
    env:
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      MONGO_URI: mongodb://localhost:27017/stellaredupay_test
      JWT_SECRET: ci-test-jwt-secret-not-used-in-production
      SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: \( {{ runner.os }}-node- \){{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - run: cd frontend && npm ci && cd ..
      - name: Syntax check
        run: npm run check:syntax
      - name: Run migrations against CI MongoDB
        working-directory: backend
        run: npm run migrate
      - run: npm test

  docker-build:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t stellaredupay/backend:ci ./backend

      - name: Smoke-test backend container
        run: |
          docker run -d \
            --name backend-ci \
            --network host \
            -e JWT_SECRET=ci-smoke-test-secret \
            -e MONGO_URI=mongodb://localhost:27017/stellaredupay_smoketest \
            -e STELLAR_NETWORK=testnet \
            -e SCHOOL_WALLET_ADDRESS=GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5 \
            stellaredupay/backend:ci
          for i in $(seq 1 12); do
            if curl -sf http://localhost:5000/health/live; then
              echo ""
              echo "Backend is live"
              exit 0
            fi
            echo "Waiting for backend to start... ($i/12)"
            sleep 5
          done
          docker logs backend-ci
          echo "Backend failed to start within 60 seconds"
          exit 1

      - name: Build frontend image
        run: docker build -t stellaredupay/frontend:ci ./frontend

      - name: Set immutable image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag images with commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag stellaredupay/backend:ci stellaredupay/backend:${{ steps.meta.outputs.tag }}
          docker tag stellaredupay/frontend:ci stellaredupay/frontend:${{ steps.meta.outputs.tag }}
          echo "Backend:  stellaredupay/backend:${{ steps.meta.outputs.tag }}"
          echo "Frontend: stellaredupay/frontend:${{ steps.meta.outputs.tag }}"
