apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging / testnet overlay.
# Apply with: kubectl apply -k deploy/k8s/overlays/testnet
#
# Image tags are pinned to an immutable commit SHA from CI.
# Update newTag when promoting a validated build.

resources:
  - ../../

images:
  - name: stellaredupay/backend
    newTag: sha-PLACEHOLDER
  - name: stellaredupay/frontend
    newTag: sha-PLACEHOLDER

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: STELLAR_NETWORK
                    value: "testnet"
    target:
      kind: Deployment
      name: backend
