apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production / mainnet overlay.
# Apply with: kubectl apply -k deploy/k8s/overlays/mainnet
#
# Image tags are pinned to an immutable commit SHA. Promoting from
# testnet to mainnet is a one-line newTag change — reviewable in git.

resources:
  - ../../

images:
  - name: stellaredupay/backend
    newTag: sha-PLACEHOLDER
  - name: stellaredupay/frontend
    newTag: sha-PLACEHOLDER

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: STELLAR_NETWORK
                    value: "mainnet"
    target:
      kind: Deployment
      name: backend
